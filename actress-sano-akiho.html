<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>佐野秋帆 出演作品一覧 - AVPRESS</title>
  <meta name="description" content="佐野秋帆の出演作品一覧。最新作から過去作まで網羅。">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .actress-hero {
      background: linear-gradient(135deg, var(--dark) 0%, #2d2d50 100%);
      padding: 32px 0 0;
      margin-bottom: 24px;
    }
    .actress-hero-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 16px 32px;
      display: flex;
      align-items: flex-start;
      gap: 28px;
    }
    .actress-avatar-placeholder {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #2d2d50;
      border: 3px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      flex-shrink: 0;
    }
    .actress-info { flex: 1; }
    .actress-name {
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }
    .actress-name-ruby { font-size: 13px; color: #aaa; margin-bottom: 12px; }
    .actress-stats { display: flex; gap: 24px; flex-wrap: wrap; }
    .actress-stat { text-align: center; }
    .actress-stat-num { font-size: 22px; font-weight: 700; color: var(--accent); display: block; }
    .actress-stat-label { font-size: 11px; color: #aaa; }
    .actress-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
    .actress-tag {
      padding: 3px 10px;
      background: rgba(229,57,53,0.15);
      border: 1px solid rgba(229,57,53,0.4);
      border-radius: 3px;
      font-size: 12px;
      color: #ff8a80;
    }
    .actress-tabs { background: var(--dark); border-top: 1px solid #333; }
    .actress-tabs-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
    }
    .actress-tab {
      padding: 12px 20px;
      color: #aaa;
      font-size: 13px;
      font-weight: 700;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
      display: block;
    }
    .actress-tab.active, .actress-tab:hover { color: #fff; border-bottom-color: var(--accent); }
    .actress-works-section {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 16px 48px;
    }
    .actress-section-title {
      font-size: 16px;
      font-weight: 700;
      border-left: 4px solid var(--accent);
      padding-left: 10px;
      margin-bottom: 16px;
    }
    .actress-works-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }
    @media (max-width: 600px) {
      .actress-hero-inner { flex-direction: column; align-items: center; text-align: center; }
      .actress-stats { justify-content: center; }
      .actress-tags { justify-content: center; }
      .actress-works-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">AV<span>PRESS</span></a>
      <nav class="site-nav">
        <a href="index.html">新着</a>
        <a href="actresses.html" class="active">女優</a>
        <a href="makers.html">メーカー</a>
        <a href="genres.html">ジャンル</a>
        <a href="ranking.html">ランキング</a>
      </nav>
      <div class="header-search">
        <input type="text" placeholder="作品・女優名で検索...">
        <button>検索</button>
      </div>
    </div>
  </header>

  <div class="actress-hero">
    <div class="actress-hero-inner">
      <img class="actress-avatar" src="image/sano_akiho.webp" alt="佐野秋帆">
      <div class="actress-info">
        <div class="actress-name">佐野秋帆</div>
        <div class="actress-name-ruby">さの あきほ</div>
        <div class="actress-stats">
          <div class="actress-stat">
            <span class="actress-stat-num" id="workCount">—</span>
            <span class="actress-stat-label">出演作品数</span>
          </div>
          <div class="actress-stat">
            <span class="actress-stat-num" id="makerCount">—</span>
            <span class="actress-stat-label">メーカー数</span>
          </div>
          <div class="actress-stat">
            <span class="actress-stat-num" id="latestDate">—</span>
            <span class="actress-stat-label">最新作</span>
          </div>
        </div>
        <div class="actress-tags" id="actressTags"></div>
      </div>
    </div>
    <div class="actress-tabs">
      <div class="actress-tabs-inner">
        <a class="actress-tab active" href="#">出演作品一覧</a>
      </div>
    </div>
  </div>

  <div class="actress-works-section">
    <div class="actress-section-title">出演作品一覧</div>
    <div class="actress-works-grid" id="actressWorksGrid"></div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>当サイトに掲載されている作品はすべて18歳以上を対象としています。</p>
      <p class="footer-links">
        <a href="privacy.html">プライバシーポリシー</a> |
        <a href="disclaimer.html">免責事項</a> |
        <a href="contact.html">お問い合わせ</a>
      </p>
      <p class="footer-copy">&copy; 2026 AVPRESS. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script>
    const actressName = '佐野秋帆';
    const works = worksData
      .filter(w => w.actress === actressName)
      .sort((a, b) => new Date(b.date) - new Date(a.date));

    document.getElementById('workCount').textContent = works.length;
    const makers = [...new Set(works.map(w => w.maker))];
    document.getElementById('makerCount').textContent = makers.length;
    if (works.length > 0) {
      const d = new Date(works[0].date);
      document.getElementById('latestDate').textContent = `${d.getMonth()+1}/${d.getDate()}`;
    } else {
      document.getElementById('latestDate').textContent = '—';
    }

    const tagCount = {};
    works.forEach(w => w.tags.forEach(t => { tagCount[t] = (tagCount[t]||0)+1; }));
    const topTags = Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).slice(0,6);
    document.getElementById('actressTags').innerHTML =
      topTags.map(([t]) => `<span class="actress-tag">${t}</span>`).join('');

    const grid = document.getElementById('actressWorksGrid');
    if (works.length === 0) {
      grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--sub);padding:48px 20px;">現在掲載中の出演作品はありません。<br>順次追加予定です。</p>';
    } else {
      grid.innerHTML = works.map(w => {
        const badgeClass = w.badge === 'NEW' ? 'new' : w.badge === 'VR' ? 'vr' : 'hd';
        return `
          <a class="work-card" href="${w.url}" target="_blank" rel="noopener noreferrer">
            <div class="work-thumb">
              <img src="${w.thumb}" alt="${w.title}" loading="lazy">
              ${w.badge ? `<span class="work-badge ${badgeClass}">${w.badge}</span>` : ''}
              <div class="work-overlay"><span>詳細を見る →</span></div>
            </div>
            <div class="work-info">
              <div class="work-title">${w.title}</div>
              <div class="work-actress">${w.actress}</div>
              <div class="work-meta">
                <span class="work-maker">${w.maker}</span>
                <span class="work-code">${w.code}</span>
              </div>
              <div class="work-tags">
                ${w.tags.slice(0,3).map(t=>`<span class="work-tag">${t}</span>`).join('')}
              </div>
            </div>
          </a>
        `;
      }).join('');
    }
  </script>
</body>
</html>
