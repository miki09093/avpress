<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ - AVPRESS</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/page.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">AV<span>PRESS</span></a>
      <nav class="site-nav">
        <a href="index.html">新着</a>
        <a href="actresses.html">女優</a>
        <a href="makers.html">メーカー</a>
        <a href="genres.html">ジャンル</a>
        <a href="ranking.html">ランキング</a>
      </nav>
    </div>
  </header>

  <div class="page-wrapper">
    <div class="page-content">
      <h1 class="page-title">お問い合わせ</h1>

      <p style="margin-bottom:24px;color:#555;line-height:1.8;">
        掲載内容に関するご意見・ご要望・誤情報のご指摘など、お気軽にお問い合わせください。<br>
        通常3営業日以内にご返信いたします。
      </p>

      <form class="contact-form" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label for="name">お名前 <span class="required">必須</span></label>
          <input type="text" id="name" name="name" placeholder="山田 太郎" required>
        </div>

        <div class="form-group">
          <label for="email">メールアドレス <span class="required">必須</span></label>
          <input type="email" id="email" name="email" placeholder="example@email.com" required>
        </div>

        <div class="form-group">
          <label for="category">お問い合わせ種別 <span class="required">必須</span></label>
          <select id="category" name="category" required>
            <option value="">選択してください</option>
            <option value="content">掲載内容について</option>
            <option value="error">誤情報の指摘</option>
            <option value="request">掲載リクエスト</option>
            <option value="copyright">著作権・権利について</option>
            <option value="other">その他</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">お問い合わせ内容 <span class="required">必須</span></label>
          <textarea id="message" name="message" rows="6" placeholder="お問い合わせ内容を入力してください..." required></textarea>
        </div>

        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" required>
            <a href="privacy.html" target="_blank">プライバシーポリシー</a>に同意する
          </label>
        </div>

        <button type="submit" class="submit-btn">送信する</button>
      </form>

      <div id="successMsg" class="success-msg" style="display:none;">
        <p>お問い合わせを受け付けました。ありがとうございます。</p>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>当サイトに掲載されている作品はすべて18歳以上を対象としています。</p>
      <p class="footer-links">
        <a href="privacy.html">プライバシーポリシー</a> |
        <a href="disclaimer.html">免責事項</a> |
        <a href="contact.html">お問い合わせ</a>
      </p>
      <p class="footer-copy">&copy; 2026 AVPRESS. All rights reserved.</p>
    </div>
  </footer>

  <script>
    function handleSubmit(e) {
      e.preventDefault();
      document.querySelector('.contact-form').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    }
  </script>
</body>
</html>
