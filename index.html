<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVPRESS - AV新着・更新情報まとめ</title>
  <meta name="description" content="AVPRESSはAV作品の新着・更新情報をまとめてお届けするサイトです。女優・メーカー・ジャンルから最新作品を探せます。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">AV<span>PRESS</span></a>
      <nav class="site-nav">
        <a href="index.html" class="active">新着</a>
        <a href="actresses.html">女優</a>
        <a href="makers.html">メーカー</a>
        <a href="genres.html">ジャンル</a>
        <a href="ranking.html">ランキング</a>
      </nav>
      <div class="header-search">
        <input type="text" id="searchInput" placeholder="作品・女優名で検索...">
        <button onclick="filterWorks()">検索</button>
      </div>
    </div>
  </header>

  <div class="layout-wrapper">

    <main class="main-content">

      <div class="section-header">
        <h2 class="section-title">新着作品</h2>
        <div class="sort-controls">
          <span>並び替え：</span>
          <button class="sort-btn active" onclick="sortWorks('date', event)">更新日時</button>
          <button class="sort-btn" onclick="sortWorks('title', event)">タイトル順</button>
        </div>
      </div>

      <div class="tag-filters" id="tagFilters">
        <button class="tag-btn active" onclick="filterByTag('all', event)">すべて</button>
        <button class="tag-btn" onclick="filterByTag('単体作品', event)">単体作品</button>
        <button class="tag-btn" onclick="filterByTag('素人', event)">素人</button>
        <button class="tag-btn" onclick="filterByTag('ハメ撮り', event)">ハメ撮り</button>
        <button class="tag-btn" onclick="filterByTag('人妻', event)">人妻</button>
        <button class="tag-btn" onclick="filterByTag('熟女', event)">熟女</button>
        <button class="tag-btn" onclick="filterByTag('巨乳', event)">巨乳</button>
        <button class="tag-btn" onclick="filterByTag('中出し', event)">中出し</button>
        <button class="tag-btn" onclick="filterByTag('痴女', event)">痴女</button>
        <button class="tag-btn" onclick="filterByTag('美少女', event)">美少女</button>
        <button class="tag-btn" onclick="filterByTag('VR', event)">VR</button>
        <button class="tag-btn" onclick="filterByTag('企画', event)">企画</button>
      </div>

      <div class="works-grid" id="worksGrid"></div>
      <div class="pagination" id="pagination"></div>

    </main>

    <aside class="sidebar">

      <div class="sidebar-widget">
        <h3 class="widget-title">人気女優</h3>
        <ul class="actress-list">
          <li><a href="actress-aizawa-miyu.html">逢沢みゆ</a></li>
          <li><a href="actress-sano-akiho.html">佐野秋帆</a></li>
          <li><a href="#">葵つかさ</a></li>
          <li><a href="#">橋本ありな</a></li>
          <li><a href="#">星乃もあ</a></li>
          <li><a href="#">七沢みあ</a></li>
          <li><a href="#">鈴村あいり</a></li>
          <li><a href="#">天使もえ</a></li>
          <li><a href="#">吉沢明歩</a></li>
          <li><a href="#">三上悠亜</a></li>
        </ul>
      </div>

      <div class="sidebar-widget">
        <h3 class="widget-title">ジャンルから探す</h3>
        <div class="genre-cloud" id="sidebarGenres"></div>
      </div>

      <div class="sidebar-widget">
        <h3 class="widget-title">メーカーから探す</h3>
        <ul class="maker-list" id="sidebarMakers"></ul>
      </div>

    </aside>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>当サイトに掲載されている作品はすべて18歳以上を対象としています。</p>
      <p class="footer-links">
        <a href="privacy.html">プライバシーポリシー</a> |
        <a href="disclaimer.html">免責事項</a> |
        <a href="contact.html">お問い合わせ</a>
      </p>
      <p class="footer-copy">&copy; 2026 AVPRESS. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
