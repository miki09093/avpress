<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ジャンル一覧 - AVPRESS</title>
  <meta name="description" content="AVPRESSに掲載されているジャンル一覧。ジャンルごとに作品を絞り込めます。">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .page-main { max-width: 1280px; margin: 0 auto; padding: 24px 16px 48px; }

    .genres-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 32px;
    }

    .genre-card {
      background: #fff;
      border-radius: 8px;
      padding: 16px 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      text-align: center;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.15s;
    }

    .genre-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .genre-card.active { border-color: var(--accent); background: #fff5f5; }

    .genre-card-name {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #333;
    }

    .genre-card.active .genre-card-name { color: var(--accent); }

    .genre-card-count {
      font-size: 11px;
      color: var(--sub);
    }

    .genre-card.active .genre-card-count { color: var(--accent); }

    .genre-works-section { margin-top: 8px; }

    .genre-works-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    @media (max-width: 600px) {
      .genres-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">AV<span>PRESS</span></a>
      <nav class="site-nav">
        <a href="index.html">新着</a>
        <a href="actresses.html">女優</a>
        <a href="makers.html">メーカー</a>
        <a href="genres.html" class="active">ジャンル</a>
        <a href="ranking.html">ランキング</a>
      </nav>
      <div class="header-search">
        <input type="text" placeholder="作品・女優名で検索...">
        <button>検索</button>
      </div>
    </div>
  </header>

  <div class="page-main">
    <div class="section-header" style="margin-bottom:16px;">
      <h2 class="section-title">ジャンル一覧</h2>
      <div class="sort-controls"><span id="genreCount"></span></div>
    </div>

    <div class="genres-grid" id="genresGrid"></div>

    <div class="genre-works-section" id="genreWorksSection" style="display:none;">
      <div class="genre-works-header">
        <h3 class="section-title" id="genreWorksTitle"></h3>
        <button onclick="clearGenre()" style="font-size:12px;padding:4px 12px;border:1px solid #ddd;background:#fff;border-radius:4px;cursor:pointer;">クリア</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;" id="genreWorksGrid"></div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>当サイトに掲載されている作品はすべて18歳以上を対象としています。</p>
      <p class="footer-links">
        <a href="privacy.html">プライバシーポリシー</a> |
        <a href="disclaimer.html">免責事項</a> |
        <a href="contact.html">お問い合わせ</a>
      </p>
      <p class="footer-copy">&copy; 2026 AVPRESS. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script>
    let selectedGenre = null;

    function buildGenres() {
      const map = {};
      worksData.forEach(w => {
        w.tags.forEach(t => {
          if (!map[t]) map[t] = 0;
          map[t]++;
        });
      });
      return Object.entries(map).sort((a, b) => b[1] - a[1]);
    }

    const allGenres = buildGenres();

    function renderGenres() {
      document.getElementById('genreCount').textContent = `${allGenres.length}ジャンル`;
      document.getElementById('genresGrid').innerHTML = allGenres.map(([tag, count]) => `
        <div class="genre-card ${selectedGenre === tag ? 'active' : ''}" onclick="selectGenre('${tag}')">
          <div class="genre-card-name">${tag}</div>
          <div class="genre-card-count">${count}作品</div>
        </div>
      `).join('');
    }

    function selectGenre(tag) {
      selectedGenre = selectedGenre === tag ? null : tag;
      renderGenres();
      if (!selectedGenre) {
        clearGenre();
        return;
      }
      const works = worksData.filter(w => w.tags.includes(tag))
        .sort((a, b) => new Date(b.date) - new Date(a.date));
      document.getElementById('genreWorksTitle').textContent = `「${tag}」の作品一覧（${works.length}件）`;
      document.getElementById('genreWorksGrid').innerHTML = works.map(w => cardHtml(w)).join('');
      document.getElementById('genreWorksSection').style.display = 'block';
      document.getElementById('genreWorksSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function clearGenre() {
      selectedGenre = null;
      renderGenres();
      document.getElementById('genreWorksSection').style.display = 'none';
    }

    function cardHtml(w) {
      const badgeClass = w.badge === 'NEW' ? 'new' : w.badge === 'VR' ? 'vr' : 'hd';
      return `
        <a class="work-card" href="${w.url}" target="_blank" rel="noopener noreferrer">
          <div class="work-thumb">
            <img src="${w.thumb}" alt="${w.title}" loading="lazy">
            ${w.badge ? `<span class="work-badge ${badgeClass}">${w.badge}</span>` : ''}
            <div class="work-overlay"><span>詳細を見る →</span></div>
          </div>
          <div class="work-info">
            <div class="work-title">${w.title}</div>
            <div class="work-actress">${w.actress}</div>
            <div class="work-meta">
              <span class="work-maker">${w.maker}</span>
              <span class="work-code">${w.code}</span>
            </div>
            <div class="work-tags">
              ${w.tags.slice(0,3).map(t=>`<span class="work-tag">${t}</span>`).join('')}
            </div>
          </div>
        </a>
      `;
    }

    renderGenres();
  </script>
</body>
</html>
